[package]
name = "rust_project"
version = "0.1.0"
edition = "2024"
default-run = "rust_project"

[dependencies]
axum = "0.8.9"
chrono = "0.4.45"
dotenvy = "0.15"
reqwest = { version = "0.13.5", features = ["json"] }
serde = { version = "1.0.229", features = ["derive"] }
sqlx = { version = "0.9.0", features = ["runtime-tokio", "postgres", "chrono"] }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread"] }
